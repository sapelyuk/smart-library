# Local development infrastructure.
#
#   docker compose up -d        # start
#   docker compose logs -f rabbitmq
#   docker compose down -v      # stop and remove the volumes

services:
  # Message broker chosen in ADR-0001 (docs/adr/0001-message-broker.md).
  rabbitmq:
    image: rabbitmq:4-management
    container_name: library-rabbitmq
    hostname: library-rabbitmq
    ports:
      - "5672:5672"    # AMQP 0-9-1, used by the services
      - "15672:15672"  # management UI, http://localhost:15672
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Primary application database for user-service, replacing the database that
  # used to run on the host. Published on host port 5432 (the conventional port)
  # now that the local server is gone, so the DSN for user-service keeps the
  # same host:port. PG 17 also unblocks the switch from lib/pq to pgx (Issue #32).
  user-db:
    image: postgres:17
    container_name: library-user-db
    hostname: library-user-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${USER_SERVICE_DB_USER:-library}
      POSTGRES_PASSWORD: ${USER_SERVICE_DB_PASSWORD:-library}
      POSTGRES_DB: ${USER_SERVICE_DB_NAME:-library_users}
      # UTF8 + ICU so ILIKE and ordering behave correctly for Cyrillic data,
      # independent of the host locale.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale-provider=icu --icu-locale=ru"
    volumes:
      - user-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${USER_SERVICE_DB_USER:-library} -d ${USER_SERVICE_DB_NAME:-library_users}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  # Vector store for the AI recommendation service (ADR-0002,
  # docs/adr/0002-ai-recommendation-architecture.md).
  # Schema and helper scripts: services/ai-service/rag/ (db/, scripts/).
  # Published on host port 5436, alongside the user-service database on 5432.
  ai-rag-db:
    image: pgvector/pgvector:pg17
    container_name: library-ai-rag-db
    hostname: library-ai-rag-db
    ports:
      - "5436:5432"
    environment:
      POSTGRES_USER: ${AI_RAG_DB_USER:-bookrag}
      POSTGRES_PASSWORD: ${AI_RAG_DB_PASSWORD:-bookrag}
      POSTGRES_DB: ${AI_RAG_DB_NAME:-bookrag}
      # Deterministic collation so index behaviour does not depend on the host locale.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - ai-rag-db-data:/var/lib/postgresql/data
      # Init scripts run once, only when the volume is first created.
      - ./services/ai-service/rag/db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AI_RAG_DB_USER:-bookrag} -d ${AI_RAG_DB_NAME:-bookrag}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  # Database for the Book Service. The service stores its catalog here through
  # pgx/v5 and applies migrations/001_init.sql on startup.
  # Published on host port 5434, alongside user-db on 5432 and ai-rag-db on 5436.
  book-db:
    image: postgres:17
    container_name: library-book-db
    hostname: library-book-db
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: ${BOOK_SERVICE_DB_USER:-library}
      POSTGRES_PASSWORD: ${BOOK_SERVICE_DB_PASSWORD:-library}
      POSTGRES_DB: ${BOOK_SERVICE_DB_NAME:-library_books}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale-provider=icu --icu-locale=ru"
    volumes:
      - book-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${BOOK_SERVICE_DB_USER:-library} -d ${BOOK_SERVICE_DB_NAME:-library_books}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  # Database for the Loan Service. Each service owns its own database (database-per-service).
  # Published on host port 5435.
  loan-db:
    image: postgres:17
    container_name: library-loan-db
    hostname: library-loan-db
    ports:
      - "5435:5432"
    environment:
      POSTGRES_USER: ${LOAN_SERVICE_DB_USER:-library}
      POSTGRES_PASSWORD: ${LOAN_SERVICE_DB_PASSWORD:-library}
      POSTGRES_DB: ${LOAN_SERVICE_DB_NAME:-library_loans}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale-provider=icu --icu-locale=ru"
    volumes:
      - loan-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LOAN_SERVICE_DB_USER:-library} -d ${LOAN_SERVICE_DB_NAME:-library_loans}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  # User Service container. Built from the repo root because the module's
  # replace directive points to the pkg module at ../../pkg.
  user-service:
    build:
      context: .
      dockerfile: services/user-service/Dockerfile
    image: library/user-service:local
    container_name: library-user-service
    hostname: library-user-service
    depends_on:
      user-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "8082:8082"  # gRPC API
      - "8092:8092"  # REST + Swagger + /healthz
    environment:
      USER_SERVICE_GRPC_ADDR: ":8082"
      USER_SERVICE_HTTP_ADDR: ":8092"
      USER_SERVICE_LOG_LEVEL: ${USER_SERVICE_LOG_LEVEL:-info}
      # Inside the compose network the database is reachable by its service
      # name, not 127.0.0.1.
      USER_SERVICE_DB_DSN: host=user-db port=5432 user=${USER_SERVICE_DB_USER:-library} password=${USER_SERVICE_DB_PASSWORD:-library} dbname=${USER_SERVICE_DB_NAME:-library_users} sslmode=disable
      # Domain events are published to RabbitMQ (ADR-0001).
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@rabbitmq:5672/
      USER_SERVICE_SEED_LIBRARIAN_EMAIL: ${USER_SERVICE_SEED_LIBRARIAN_EMAIL:-}
      USER_SERVICE_SEED_LIBRARIAN_PASSWORD: ${USER_SERVICE_SEED_LIBRARIAN_PASSWORD:-}
    restart: unless-stopped

  # Book Service container. Stores its catalog in book-db over pgx/v5.
  book-service:
    build:
      context: .
      dockerfile: services/book-service/Dockerfile
    image: library/book-service:local
    container_name: library-book-service
    hostname: library-book-service
    depends_on:
      book-db:
        condition: service_healthy
    ports:
      - "8081:8081"  # gRPC API
      - "8091:8091"  # REST + Swagger + /healthz
    environment:
      BOOK_SERVICE_GRPC_ADDR: ":8081"
      BOOK_SERVICE_HTTP_ADDR: ":8091"
      BOOK_SERVICE_LOG_LEVEL: ${BOOK_SERVICE_LOG_LEVEL:-info}
      # Inside the compose network the database is reachable by its service
      # name, not 127.0.0.1.
      BOOK_SERVICE_DB_DSN: host=book-db port=5432 user=${BOOK_SERVICE_DB_USER:-library} password=${BOOK_SERVICE_DB_PASSWORD:-library} dbname=${BOOK_SERVICE_DB_NAME:-library_books} sslmode=disable
    restart: unless-stopped

  # Loan Service container. Manages the lending lifecycle (issue, return, renew)
  # and calls book-service for copy reservation/release and user-service for auth.
  loan-service:
    build:
      context: .
      dockerfile: services/loan-service/Dockerfile
    image: library/loan-service:local
    container_name: library-loan-service
    hostname: library-loan-service
    depends_on:
      loan-db:
        condition: service_healthy
      book-service:
        condition: service_started
      user-service:
        condition: service_started
    ports:
      - "8083:8083"  # gRPC API
      - "8093:8093"  # REST + Swagger + /healthz
    environment:
      LOAN_SERVICE_GRPC_ADDR: ":8083"
      LOAN_SERVICE_HTTP_ADDR: ":8093"
      LOAN_SERVICE_LOG_LEVEL: ${LOAN_SERVICE_LOG_LEVEL:-info}
      LOAN_SERVICE_DB_DSN: host=loan-db port=5432 user=${LOAN_SERVICE_DB_USER:-library} password=${LOAN_SERVICE_DB_PASSWORD:-library} dbname=${LOAN_SERVICE_DB_NAME:-library_loans} sslmode=disable
      LOAN_SERVICE_BOOK_SERVICE_GRPC_ADDR: book-service:8081
      LOAN_SERVICE_USER_SERVICE_GRPC_ADDR: user-service:8082
      LOAN_SERVICE_LOAN_PERIOD: ${LOAN_SERVICE_LOAN_PERIOD:-336h}
    restart: unless-stopped

  # API Gateway — единый HTTP-вход для клиентских приложений.
  # Проверяет bearer-токены через gRPC AuthenticateToken user-service и
  # маршрутизирует запросы к book-service и user-service через их REST-эндпоинты.
  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    image: library/api-gateway:local
    container_name: library-api-gateway
    hostname: library-api-gateway
    depends_on:
      book-service:
        condition: service_started
      user-service:
        condition: service_started
    ports:
      - "8080:8080"  # HTTP API (REST + /healthz)
    environment:
      GATEWAY_HTTP_ADDR: ":8080"
      GATEWAY_BOOK_SERVICE_URL: http://book-service:8091
      GATEWAY_USER_SERVICE_URL: http://user-service:8092
      # gRPC address of user-service, used for AuthenticateToken calls.
      GATEWAY_USER_SERVICE_GRPC_ADDR: user-service:8082
      GATEWAY_LOG_LEVEL: ${GATEWAY_LOG_LEVEL:-info}
      GATEWAY_LOG_FORMAT: ${GATEWAY_LOG_FORMAT:-json}
    restart: unless-stopped

  # Notification Service — consumer of loan.* events from RabbitMQ that sends
  # email/SMS reminders about due dates. No database of its own: it subscribes
  # to the platform broker and delegates delivery to an SMTP transport.
  notification-service:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    image: library/notification-service:local
    container_name: library-notification-service
    hostname: library-notification-service
    depends_on:
      rabbitmq:
        condition: service_healthy
    ports:
      - "8084:8084"  # gRPC API
      - "8094:8094"  # REST + Swagger + /healthz
    environment:
      NOTIFICATION_SERVICE_GRPC_ADDR: ":8084"
      NOTIFICATION_SERVICE_HTTP_ADDR: ":8094"
      NOTIFICATION_SERVICE_LOG_LEVEL: ${NOTIFICATION_SERVICE_LOG_LEVEL:-info}
      NOTIFICATION_SERVICE_SMTP_HOST: ${NOTIFICATION_SERVICE_SMTP_HOST:-localhost}
      NOTIFICATION_SERVICE_SMTP_PORT: ${NOTIFICATION_SERVICE_SMTP_PORT:-1025}
      NOTIFICATION_SERVICE_SMTP_USERNAME: ${NOTIFICATION_SERVICE_SMTP_USERNAME:-}
      NOTIFICATION_SERVICE_SMTP_PASSWORD: ${NOTIFICATION_SERVICE_SMTP_PASSWORD:-}
      NOTIFICATION_SERVICE_SMTP_FROM: ${NOTIFICATION_SERVICE_SMTP_FROM:-notifications@localhost}
      # Connect to the platform broker.
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@rabbitmq:5672/
      RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE:-}
    restart: unless-stopped

  # AI Service — Go-адаптер рекомендательного сервиса (ADR-0002).
  # Отвечает на GenerateRecommendations через RAG-воркфлоу (n8n), ведёт
  # pgvector-индекс каталога и потребляет события book.* из RabbitMQ.
  # RAG-прототип живёт в services/ai-service/rag/ (схема — rag/db/init.sql).
  ai-service:
    build:
      context: .
      dockerfile: services/ai-service/Dockerfile
    image: library/ai-service:local
    container_name: library-ai-service
    hostname: library-ai-service
    depends_on:
      ai-rag-db:
        condition: service_healthy
      book-service:
        condition: service_started
      user-service:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    ports:
      - "8085:8085"  # gRPC API
      - "8095:8095"  # REST + Swagger + /healthz
    environment:
      AI_GRPC_ADDR: ":8085"
      AI_HTTP_ADDR: ":8095"
      AI_LOG_LEVEL: ${AI_LOG_LEVEL:-info}
      AI_LOG_FORMAT: ${AI_LOG_FORMAT:-json}
      AI_CATALOG_GRPC_ADDR: book-service:8081
      AI_USER_GRPC_ADDR: user-service:8082
      # RAG workflow (n8n). Inside the compose network n8n is reachable by its
      # service name on port 5678. Override via .env:
      #   AI_N8N_BASE_URL=http://host.docker.internal:5678  — local n8n
      #   AI_N8N_BASE_URL=http://n8n:5678                   — container n8n (default)
      AI_N8N_BASE_URL: ${AI_N8N_BASE_URL:-http://n8n:5678}
      AI_N8N_HEADER_NAME: ${AI_N8N_HEADER_NAME:-x-book-rag-key}
      AI_N8N_HEADER_VALUE: ${AI_N8N_HEADER_VALUE:-}
      # pgvector store: inside the compose network the database is reachable by
      # its service name, on the internal port 5432.
      AI_RAG_STORE_DSN: host=ai-rag-db port=5432 user=${AI_RAG_DB_USER:-bookrag} password=${AI_RAG_DB_PASSWORD:-bookrag} dbname=${AI_RAG_DB_NAME:-bookrag} sslmode=disable
      AI_EMBEDDINGS_BASE_URL: ${AI_EMBEDDINGS_BASE_URL:-}
      AI_EMBEDDINGS_API_KEY: ${AI_EMBEDDINGS_API_KEY:-}
      AI_EMBEDDINGS_MODEL: ${AI_EMBEDDINGS_MODEL:-gemini-embedding-001}
      AI_EMBEDDINGS_DIMENSIONS: ${AI_EMBEDDINGS_DIMENSIONS:-3072}
      # Catalog consumer: defaults to the platform broker.
      AI_CONSUMER_ENABLED: ${AI_CONSUMER_ENABLED:-true}
      AI_RABBITMQ_URL: ${AI_RABBITMQ_URL:-amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@rabbitmq:5672/}
      AI_RABBITMQ_EXCHANGE: ${AI_RABBITMQ_EXCHANGE:-}
    restart: unless-stopped

  # RAG workflow engine (n8n) — hosts the Book RAG workflow that the AI
  # service calls for recommendations and ingest. The workflow is imported
  # from services/ai-service/rag/workflow/book-rag-system-dev.json at startup.
  # Attach credentials in the n8n UI at http://localhost:5678.
  n8n:
    image: n8nio/n8n:2.40.7
    container_name: library-n8n
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "if [ ! -f /home/node/.n8n/.workflows-imported ]; then
        n8n import:workflow --separate --input=/workflows/ &&
        n8n publish:workflow --id=BookRagSys2026 &&
        node -e \"const s=require('/usr/local/lib/node_modules/n8n/node_modules/.pnpm/sqlite3@5.1.7_bluebird@3.7.2_supports-color@8.1.1/node_modules/sqlite3').Database; const db=new s('/home/node/.n8n/database.sqlite'); db.run('UPDATE workflow_entity SET active=1 WHERE id=?', ['BookRagSys2026'], function(e){db.close()});\" &&
        touch /home/node/.n8n/.workflows-imported;
      fi;
      exec n8n start"
    ports:
      # Host port 5679 to avoid conflict with a local n8n on 5678.
      # Inside the compose network the service is reachable as n8n:5678.
      - "5679:5678"
    environment:
      # Persist the internal SQLite database and credentials on a volume.
      DB_TYPE: sqlite
      DB_SQLITE_FILE: /home/node/.n8n/database.sqlite
      # Allow plain http access from the compose network.
      N8N_SECURE_COOKIE: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-UTC}
      TZ: ${GENERIC_TIMEZONE:-UTC}
      # Basic auth for REST API (needed to activate imported workflows).
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: n8n
      N8N_BASIC_AUTH_PASSWORD: n8n-dev
    volumes:
      - n8n-data:/home/node/.n8n
      # Only the dev workflow is imported to avoid duplicate node-name conflicts.
      - ./services/ai-service/rag/workflow/import:/workflows:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5678/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

volumes:
  rabbitmq-data:
  ai-rag-db-data:
  user-db-data:
  book-db-data:
  loan-db-data:
  n8n-data:
