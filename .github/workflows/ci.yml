name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel in-flight runs for the same branch or PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.26'

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      # Module download cache (pkg/mod) and build cache (GOCACHE).
      - uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ env.GO_VERSION }}-${{ hashFiles('**/go.sum', 'go.work.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-${{ env.GO_VERSION }}-
            ${{ runner.os }}-go-

      - name: Build pkg
        run: go build ./...
        working-directory: pkg

      - name: Build api-gateway
        run: go build ./...
        working-directory: services/api-gateway

      - name: Build book-service
        run: go build ./...
        working-directory: services/book-service

      - name: Build user-service
        run: go build ./...
        working-directory: services/user-service

      - name: Build loan-service
        run: go build ./...
        working-directory: services/loan-service

      - name: Build ai-service
        run: go build ./...
        working-directory: services/ai-service

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build
    services:
      # PostgreSQL for the book-service storage tests. The tests apply the
      # service migrations themselves and are skipped when POSTGRES_TEST_DSN
      # is not set, so the other modules are unaffected by this service.
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: library
          POSTGRES_PASSWORD: library
          POSTGRES_DB: library_books_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U library -d library_books_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      # A second instance for loan-service. Every service owns its own schema,
      # so the two storage test suites must not share schema_migrations: both
      # services ship a migration version 001 with different content.
      postgres-loan:
        image: postgres:17
        env:
          POSTGRES_USER: library
          POSTGRES_PASSWORD: library
          POSTGRES_DB: library_loans_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U library -d library_loans_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      # RabbitMQ for the pkg/events transport integration test. The test is
      # skipped when RABBITMQ_TEST_URL is not set, so the other modules are
      # unaffected by this service.
      rabbitmq:
        image: rabbitmq:4-management
        env:
          RABBITMQ_DEFAULT_USER: guest
          RABBITMQ_DEFAULT_PASS: guest
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      POSTGRES_TEST_DSN: host=localhost port=5432 user=library password=library dbname=library_books_test sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ env.GO_VERSION }}-${{ hashFiles('**/go.sum', 'go.work.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-${{ env.GO_VERSION }}-
            ${{ runner.os }}-go-

      # The transport integration test runs against the RabbitMQ service above.
      - name: Test pkg
        run: go test ./... -race -coverprofile=coverage.txt -covermode=atomic
        working-directory: pkg
        env:
          RABBITMQ_TEST_URL: amqp://guest:guest@localhost:5672/

      - name: Coverage report (pkg)
        if: always()
        run: go tool cover -func=coverage.txt | tee -a "$GITHUB_STEP_SUMMARY"
        working-directory: pkg

      - name: Test book-service
        run: go test ./... -race -coverprofile=coverage.txt -covermode=atomic
        working-directory: services/book-service

      - name: Coverage report (book-service)
        if: always()
        run: go tool cover -func=coverage.txt | tee -a "$GITHUB_STEP_SUMMARY"
        working-directory: services/book-service

      - name: Test user-service
        run: go test ./... -race -coverprofile=coverage.txt -covermode=atomic
        working-directory: services/user-service

      - name: Coverage report (user-service)
        if: always()
        run: go tool cover -func=coverage.txt | tee -a "$GITHUB_STEP_SUMMARY"
        working-directory: services/user-service

      # The loan storage suite runs against its own database instance.
      - name: Test loan-service
        run: go test ./... -race -coverprofile=coverage.txt -covermode=atomic
        working-directory: services/loan-service
        env:
          POSTGRES_TEST_DSN: host=localhost port=5433 user=library password=library dbname=library_loans_test sslmode=disable

      - name: Coverage report (loan-service)
        if: always()
        run: go tool cover -func=coverage.txt | tee -a "$GITHUB_STEP_SUMMARY"
        working-directory: services/loan-service

      - name: Test api-gateway
        run: go test ./... -race -coverprofile=coverage.txt -covermode=atomic
        working-directory: services/api-gateway

      - name: Coverage report (api-gateway)
        if: always()
        run: go tool cover -func=coverage.txt | tee -a "$GITHUB_STEP_SUMMARY"
        working-directory: services/api-gateway

      # ai-service has no PostgreSQL storage tests, so it runs without
      # POSTGRES_TEST_DSN — only domain, auth, and handler tests.
      - name: Test ai-service
        run: go test ./... -race -coverprofile=coverage.txt -covermode=atomic
        working-directory: services/ai-service

      - name: Coverage report (ai-service)
        if: always()
        run: go tool cover -func=coverage.txt | tee -a "$GITHUB_STEP_SUMMARY"
        working-directory: services/ai-service
